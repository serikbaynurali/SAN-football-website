<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAN Football Hub - Contact</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Task 1: Flexbox Navigation -->
  <header id="main-header">
    <div class="nav-container">
      <div class="nav-brand">⚽ SAN Football Hub</div>
      <ul class="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="players.html">Players</a></li>
        <li><a href="schedule.html">Schedule</a></li>
        <li><a href="tactics.html">Tactics</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </header>

  <!-- Task 3: Grid Layout Container -->
  <div class="page-layout-grid">
    <aside class="sidebar">
      <h3>Contact Us</h3>
      <p>Astana IT University</p>
      <p>Group SE-2511</p>
    </aside>

    <main class="main-content">
      <h1>Contact Feedback Form</h1>
      <form id="contact-form">
        <div class="form-group">
          <label for="name">Your Name:</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">Your Email:</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn-submit">Send Message</button>
      </form>
    </main>
  </div>

  <footer id="main-footer">
    <p>&copy; 2026 Group SAN (SE-2511). All rights reserved.</p>
  </footer>

</body>
</html>
